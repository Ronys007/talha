<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vama-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="40%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="vama-v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="vama-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#vama-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Invoice Sheet Outline -->
  <rect x="18" y="12" width="28" height="38" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
  
  <!-- Invoice Fold / Corner cut -->
  <path d="M38 12 L46 20 H40 C38.9 20 38 19.1 38 18 V12 Z" fill="rgba(255,255,255,0.22)"/>

  <!-- Horizontal invoice ledger lines -->
  <line x1="23" y1="21" x2="34" y2="21" stroke="rgba(255,255,255,0.3)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="23" y1="26" x2="41" y2="26" stroke="rgba(255,255,255,0.3)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Bold Modern V Shape Overlaid -->
  <path d="M16 22 L31.2 46.5 C31.6 47.1 32.4 47.1 32.8 46.5 L48 22" stroke="url(#vama-v)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 25 L32 41 L42 25" stroke="url(#vama-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent sparkles / dots -->
  <circle cx="16" cy="22" r="3" fill="#38bdf8"/>
  <circle cx="48" cy="22" r="3" fill="#ffffff"/>
  <circle cx="32" cy="46" r="2.2" fill="#38bdf8"/>
</svg>
