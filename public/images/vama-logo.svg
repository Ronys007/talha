<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="vama-full-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="40%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="vama-full-v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="vama-full-acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark (left, 52x52) -->
  <g transform="translate(4, 4)">
    <rect width="52" height="52" rx="14" fill="url(#vama-full-bg)"/>
    <rect x="0.75" y="0.75" width="50.5" height="50.5" rx="13.25" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

    <!-- Mini Invoice paper -->
    <rect x="15" y="10" width="22" height="30" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <path d="M30 10 L37 17 H32 C30.9 17 30 16.1 30 15 V10 Z" fill="rgba(255,255,255,0.25)"/>

    <!-- Dynamic V -->
    <path d="M13 18 L25.5 38.5 C25.8 39 26.5 39 26.8 38.5 L39 18" stroke="url(#vama-full-v)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 20 L26 33.5 L34 20" stroke="url(#vama-full-acc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="13" cy="18" r="2.2" fill="#38bdf8"/>
    <circle cx="39" cy="18" r="2.2" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <text x="68" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#1e1b4b" letter-spacing="-0.02em">
    Vama <tspan fill="#4f46e5">Invoice</tspan>
  </text>
  <text x="68" y="47" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.02em">
    powered by <tspan fill="#4f46e5" font-weight="700">Vama labs</tspan>
  </text>
</svg>
